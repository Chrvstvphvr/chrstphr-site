<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poll Results</title>
<style>
  :root {
    --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8;
    --accent:#6366f1; --bar-bg:#334155;
    --c0:#6366f1; --c1:#14b8a6; --c2:#f59e0b; --c3:#ec4899; --c4:#8b5cf6;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #1e293b 0%, var(--bg) 60%);
    color:var(--text);
    min-height:100dvh;
    padding:clamp(20px,4vh,48px) clamp(16px,4vw,56px) 60px;
  }
  .page { max-width:min(1100px,94vw); margin:0 auto; }

  /* ---- Current (large) ---- */
  .hero { margin-bottom:clamp(32px,6vh,64px); }
  .eyebrow {
    text-align:center; color:var(--accent); font-weight:700;
    font-size:clamp(1.1rem,3vmin,1.8rem); margin:0 0 clamp(6px,1.2vh,14px);
  }
  .hero-q {
    text-align:center; font-weight:800; letter-spacing:-.02em; line-height:1.08;
    font-size:clamp(2.2rem,6.5vmin,4.4rem); margin:0 0 clamp(20px,4vh,44px);
  }
  .big-row { margin-bottom:clamp(16px,3vh,30px); }
  .big-top {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:clamp(1.3rem,3.6vmin,2.2rem); font-weight:600; margin-bottom:clamp(6px,1.2vh,12px);
  }
  .big-top .pct { font-weight:800; font-variant-numeric:tabular-nums; }
  .big-bar { height:clamp(20px,3.2vmin,34px); background:var(--bar-bg); border-radius:999px; overflow:hidden; }
  .big-fill { height:100%; width:0; border-radius:999px; transition:width .6s cubic-bezier(.22,1,.36,1); }
  .hero-total { text-align:center; color:var(--muted); margin-top:clamp(10px,2vh,20px); font-size:clamp(1rem,2.4vmin,1.4rem); }

  /* ---- Past (grid, all visible) ---- */
  .past-head {
    font-size:clamp(1.1rem,2.6vmin,1.5rem); font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em; margin:0 0 14px; padding-bottom:10px;
    border-bottom:1px solid var(--bar-bg);
  }
  .past-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(440px, 1fr)); gap:14px; align-items:start; }
  .past-card { background:var(--card); border-radius:14px; padding:16px 18px; }
  /* Title + rows are sized in em off a per-element base so the fit-to-width
     pass can scale them down; nothing wraps or truncates. */
  .past-q { font-weight:700; font-size:16.8px; margin-bottom:2px; white-space:nowrap; }
  .past-date { color:var(--muted); font-size:.8rem; margin-bottom:12px; white-space:nowrap; }
  /* One shared grid per card so bars and figures line up across rows: the
     label is 40%, the bar stretches to fill, and the figures (percent + vote
     count) auto-size to their content on the right. */
  .mini-rows { font-size:15.2px; display:grid; grid-template-columns:40% 1fr auto; column-gap:12px; row-gap:8px; align-items:center; }
  .mini-label { min-width:0; white-space:nowrap; text-align:left; }
  .mini-bar { min-width:0; height:9px; background:var(--bg); border-radius:999px; overflow:hidden; }
  .mini-fill { display:block; height:100%; border-radius:999px; }
  .mini-figs { text-align:right; white-space:nowrap; }
  .mini-figs .pct { font-weight:700; font-variant-numeric:tabular-nums; }
  .mini-figs .votes { color:var(--muted); font-size:.85em; margin-left:7px; font-variant-numeric:tabular-nums; }

  .pager { display:flex; justify-content:center; align-items:center; gap:18px; margin-top:24px; }
  .pager button {
    background:var(--card); color:var(--text); border:1px solid var(--bar-bg); border-radius:10px;
    padding:9px 18px; font-size:.95rem; font-weight:600; cursor:pointer;
  }
  .pager button:hover:not(:disabled) { border-color:var(--accent); }
  .pager button:disabled { opacity:.35; cursor:default; }
  .pager .page-info { color:var(--muted); font-size:.9rem; font-variant-numeric:tabular-nums; }

  .empty { text-align:center; color:var(--muted); padding:32px 0; }
</style>
</head>
<body>
  <div class="page">
    <section class="hero" id="hero">
      <div class="empty">Loading…</div>
    </section>

    <section>
      <h2 class="past-head">Past results</h2>
      <div class="past-list" id="pastList"><div class="empty">Loading…</div></div>
      <div class="pager" id="pastPager"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const { SUPABASE_URL, SUPABASE_KEY } = window.POLL_CONFIG;
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const COLORS = ["#6366f1","#14b8a6","#f59e0b","#ec4899","#8b5cf6"];

    const heroEl = document.getElementById("hero");
    const pastEl = document.getElementById("pastList");

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    const pct = (c, t) => (!t ? 0 : Math.round((c / t) * 100));
    const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

    // Day the poll really "ran": the date most votes came in, falling back to
    // the close timestamp for polls with no votes.
    function pollDay(p) {
      if (p.poll_date) {
        const [y, m, d] = p.poll_date.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      return p.closed_at ? new Date(p.closed_at) : null;
    }

    async function rpc(fn, args) {
      const { data, error } = await sb.rpc(fn, args || {});
      if (error) throw error;
      return data;
    }

    async function loadCurrent() {
      try {
        const [title, poll, results] = await Promise.all([
          rpc("get_poll_title"), rpc("get_active_poll"), rpc("get_active_results")
        ]);
        if (!poll) {
          heroEl.innerHTML = `<div class="empty">No active poll right now.</div>`;
          return;
        }
        const total = (results && results.total) || 0;
        const rows = poll.options.map((o, i) => {
          const c = (results && results.counts && results.counts[i]) || 0;
          const p = pct(c, total);
          return `<div class="big-row">
            <div class="big-top"><span>${esc(o)}</span><span class="pct">${p}%</span></div>
            <div class="big-bar"><div class="big-fill" style="width:${p}%;background:${COLORS[i % COLORS.length]}"></div></div>
          </div>`;
        }).join("");
        heroEl.innerHTML = `
          <p class="eyebrow">${esc(title || "Current results")}</p>
          <h1 class="hero-q">${esc(poll.question)}</h1>
          ${rows}
          <p class="hero-total">${total} vote${total === 1 ? "" : "s"} so far</p>`;
      } catch (e) {
        heroEl.innerHTML = `<div class="empty">Could not load current results.</div>`;
      }
    }

    const PAGE_SIZE = 25;
    const pagerEl = document.getElementById("pastPager");
    let pastData = [];
    let pastPage = 0;

    function pastCardHtml(p) {
      const r = p.results || { counts: [], total: 0 };
      const total = r.total || 0;
      const rows = p.options.map((o, i) => {
        const c = (r.counts && r.counts[i]) || 0;
        const pp = pct(c, total);
        return `<span class="mini-label">${esc(o)}</span>
          <span class="mini-bar"><span class="mini-fill" style="width:${pp}%;background:${COLORS[i % COLORS.length]}"></span></span>
          <span class="mini-figs"><span class="pct">${pp}%</span><span class="votes">${c.toLocaleString()} vote${c === 1 ? "" : "s"}</span></span>`;
      }).join("");
      const day = pollDay(p);
      const d = day ? day.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }) : "";
      return `<div class="past-card">
        <div class="past-q">${esc(p.question)}</div>
        <div class="past-date">${esc(d)} · ${total} votes</div>
        <div class="mini-rows">${rows}</div>
      </div>`;
    }

    // Shrink an element's font until its own single line of text fits its box.
    function fitText(el, minPx) {
      el.style.fontSize = "";
      let size = parseFloat(getComputedStyle(el).fontSize);
      let guard = 0;
      while (el.scrollWidth > el.clientWidth + 0.5 && size > minPx && guard < 60) {
        size -= 0.5;
        el.style.fontSize = size + "px";
        guard++;
      }
    }

    // Shrink the rows' shared font until every label fits its 40% cell. The
    // labels overflow their grid cells silently, so we must measure each one
    // (the container's scrollWidth doesn't reflect grid-item overflow).
    function fitRows(rowsEl, minPx) {
      rowsEl.style.fontSize = "";
      const labels = [...rowsEl.querySelectorAll(".mini-label")];
      const overflowing = () => labels.some(l => l.scrollWidth > l.clientWidth + 0.5);
      let size = parseFloat(getComputedStyle(rowsEl).fontSize);
      let guard = 0;
      while (overflowing() && size > minPx && guard < 80) {
        size -= 0.5;
        rowsEl.style.fontSize = size + "px";
        guard++;
      }
    }

    // Scale each card's title and bar rows so nothing wraps or truncates,
    // at any column width. Re-run whenever the layout could change.
    function fitCards() {
      document.querySelectorAll("#pastList .past-card").forEach(card => {
        const q = card.querySelector(".past-q");
        if (q) fitText(q, 11);
        const rows = card.querySelector(".mini-rows");
        if (rows) fitRows(rows, 9);
      });
    }

    function renderPast() {
      if (!pastData.length) {
        pastEl.innerHTML = `<div class="empty">No past polls yet.</div>`;
        pagerEl.innerHTML = "";
        return;
      }
      const pages = Math.ceil(pastData.length / PAGE_SIZE);
      pastPage = Math.min(Math.max(pastPage, 0), pages - 1);
      const start = pastPage * PAGE_SIZE;
      pastEl.innerHTML = pastData.slice(start, start + PAGE_SIZE).map(pastCardHtml).join("");
      requestAnimationFrame(fitCards);
      if (pages > 1) {
        pagerEl.innerHTML = `
          <button id="pgPrev" ${pastPage === 0 ? "disabled" : ""}>← Prev</button>
          <span class="page-info">Page ${pastPage + 1} of ${pages}</span>
          <button id="pgNext" ${pastPage >= pages - 1 ? "disabled" : ""}>Next →</button>`;
        document.getElementById("pgPrev").onclick = () => { pastPage--; renderPast(); jumpToPast(); };
        document.getElementById("pgNext").onclick = () => { pastPage++; renderPast(); jumpToPast(); };
      } else {
        pagerEl.innerHTML = "";
      }
    }

    function jumpToPast() {
      const head = document.querySelector(".past-head");
      if (head) window.scrollTo({ top: head.offsetTop - 16, behavior: "smooth" });
    }

    async function loadPast() {
      try {
        const past = await rpc("get_past_polls", { p_tz: TZ });
        pastData = past || [];
        renderPast();
      } catch (e) {
        pastEl.innerHTML = `<div class="empty">Could not load past results.</div>`;
        pagerEl.innerHTML = "";
      }
    }

    let resizeT;
    window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(fitCards, 150); });

    loadCurrent();
    loadPast();
    setInterval(loadCurrent, 3000);
    setInterval(loadPast, 10000);
  </script>
</body>
</html>

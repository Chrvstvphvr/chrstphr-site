<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Quick Poll</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #6366f1;
    --bar-bg: #334155;
    /* Title is always the biggest text; question is derived at 75% of it. */
    --title-size: clamp(2.6rem, 9vmin, 7rem);
    --c0: #6366f1;
    --c1: #14b8a6;
    --c2: #f59e0b;
    --c3: #ec4899;
    --c4: #8b5cf6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* Invisible tap target (top-left) to reach the kiosk admin page. */
  .kiosk-tap {
    position: fixed; top: 0; left: 0; width: 10vw; height: 10vw;
    z-index: 50; opacity: 0; -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1e293b 0%, var(--bg) 60%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }
  .wrap {
    flex: 1 0 auto;
    width: 100%;
    max-width: min(1100px, 94vw);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 0 clamp(16px, 3vw, 40px) clamp(80px, 11vh, 110px);
  }
  /* On the results view the peek button is hidden, so reclaim its clearance. */
  body.showing-results .wrap { padding-bottom: clamp(16px, 2.5vh, 32px); }
  /* The voting/results area fills the viewport and is vertically centered. */
  .stage {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(8px, 1.5vh, 18px);
    padding: clamp(16px, 3vh, 40px) 0;
  }
  .title {
    text-align: center;
    color: var(--accent);
    font-size: var(--title-size);
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: .01em;
    text-transform: uppercase;
    margin: 0 0 clamp(14px, 2.6vh, 32px);
  }
  .question {
    font-size: calc(var(--title-size) * 0.75);
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.02em;
    text-align: center;
    margin: 0 0 clamp(20px, 4vh, 48px);
  }
  .options { display: flex; flex-direction: column; gap: clamp(12px, 2vh, 22px); }
  .opt {
    appearance: none;
    border: 3px solid transparent;
    background: var(--card);
    color: var(--text);
    font-size: clamp(1.5rem, 4vmin, 2.4rem);
    font-weight: 600;
    padding: clamp(20px, 3.4vmin, 38px) clamp(24px, 4vmin, 40px);
    border-radius: clamp(16px, 2.4vmin, 24px);
    cursor: pointer;
    text-align: left;
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:active { transform: scale(.98); }
  .opt[data-i="0"]:hover { border-color: var(--c0); }
  .opt[data-i="1"]:hover { border-color: var(--c1); }
  .opt[data-i="2"]:hover { border-color: var(--c2); }

  /* Results */
  .result-row { margin-bottom: clamp(14px, 2.4vh, 26px); }
  .result-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: clamp(1.3rem, 3.4vmin, 2rem); font-weight: 600; margin-bottom: clamp(6px, 1.2vh, 12px);
  }
  .pct { font-variant-numeric: tabular-nums; font-weight: 800; }
  .bar { height: clamp(18px, 2.8vmin, 30px); background: var(--bar-bg); border-radius: 999px; overflow: hidden; }
  /* Bar colors are set inline from the COLORS array, cycling for 6+ answers. */
  .fill { height: 100%; width: 0; border-radius: 999px; transition: width .6s cubic-bezier(.22,1,.36,1); }

  /* Long answer lists: tighten rows so everything fits without scrolling. */
  #app.compact .result-row { margin-bottom: clamp(8px, 1.2vh, 14px); }
  #app.compact .result-top { font-size: clamp(1rem, 2.4vmin, 1.5rem); margin-bottom: clamp(4px, .7vh, 7px); }
  #app.compact .bar { height: clamp(13px, 1.9vmin, 20px); }
  #app.compact .question { font-size: calc(var(--title-size) * .55); }
  #app.compact .thanks { font-size: clamp(1.1rem, 2.6vmin, 1.6rem); margin-bottom: clamp(8px, 1.4vh, 16px); }
  #app.compact .nextbtn { margin-top: clamp(12px, 1.8vh, 22px); }

  .meta { text-align: center; color: var(--muted); margin-top: clamp(8px,1.5vh,16px); font-size: clamp(1rem, 2.4vmin, 1.4rem); }
  .thanks { text-align:center; font-size: clamp(1.4rem,3.6vmin,2.2rem); font-weight:700; margin: 0 0 clamp(16px,2.5vh,28px); }
  .nextbtn {
    display:block; margin: clamp(20px,3vh,36px) auto 0; background: var(--accent); color:#fff; border:none;
    font-size: clamp(1.1rem, 2.8vmin, 1.6rem); font-weight:700;
    padding: clamp(14px,2vh,20px) clamp(28px,5vw,48px); border-radius: 999px; cursor:pointer;
  }
  .nextbtn:active { transform: scale(.97); }

  .qr-block { display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:clamp(18px,3vh,32px); }
  .qr-block img { width:clamp(120px,18vmin,180px); height:auto; border-radius:12px; background:#fff; padding:10px; display:block; }
  .qr-cap { color:var(--muted); font-size:clamp(.95rem,2.2vmin,1.3rem); font-weight:600; }

  .empty { text-align:center; color: var(--muted); padding: 40px 0; }
  .toast { color: #fca5a5; text-align:center; min-height: 1.2em; margin-top: 10px; }

  /* Peek-at-results button + popup */
  .peek-btn {
    position: fixed; left: 50%; bottom: clamp(12px, 2.5vh, 28px); transform: translateX(-50%);
    background: var(--card); color: var(--muted); border: 1px solid var(--bar-bg);
    font-size: clamp(.95rem, 2vmin, 1.2rem); font-weight: 600;
    padding: 10px 22px; border-radius: 999px; cursor: pointer; z-index: 40;
  }
  .peek-btn:active { transform: translateX(-50%) scale(.97); }
  .peek-overlay {
    position: fixed; inset: 0; background: rgba(15, 23, 42, .82);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    z-index: 60; opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .peek-overlay.show { opacity: 1; pointer-events: auto; }
  .peek-card {
    background: var(--card); border-radius: 20px; padding: clamp(22px, 4vmin, 40px);
    width: min(620px, 92vw); max-height: 86vh; overflow-y: auto;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
  }
  .peek-card h2 { margin: 0 0 18px; font-size: clamp(1.4rem, 4vmin, 2.2rem); font-weight: 800; text-align: center; }
  /* Long answer lists: keep the whole card (including the QR) on screen. */
  .peek-card.compact h2 { margin-bottom: 12px; font-size: clamp(1.2rem, 3.2vmin, 1.8rem); }
  .peek-card.compact .result-row { margin-bottom: clamp(6px, 1vh, 12px); }
  .peek-card.compact .result-top { font-size: clamp(.95rem, 2.2vmin, 1.35rem); margin-bottom: clamp(3px, .6vh, 6px); }
  .peek-card.compact .bar { height: clamp(11px, 1.7vmin, 18px); }
  .peek-card.compact .peek-meta { margin-top: 8px; }
  .peek-card.compact .qr-block { margin-top: clamp(10px, 1.6vh, 18px); }
  .peek-card.compact .qr-block img { width: clamp(96px, 13vmin, 140px); }
  .peek-meta { text-align: center; color: var(--muted); margin-top: 14px; font-size: clamp(.95rem, 2.2vmin, 1.3rem); }
</style>
</head>
<body>
  <a href="kiosk-admin.html" class="kiosk-tap" aria-hidden="true" tabindex="-1"></a>
  <div class="wrap">
    <div class="stage">
      <div id="title" class="title"></div>
      <div id="app"><div class="empty">Loading…</div></div>
      <div id="toast" class="toast"></div>
    </div>
  </div>

  <button class="peek-btn" id="peekBtn">Peek at results</button>
  <div class="peek-overlay" id="peekOverlay" aria-hidden="true">
    <div class="peek-card" id="peekCard"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="config.js"></script>
  <script>
    const { SUPABASE_URL, SUPABASE_KEY } = window.POLL_CONFIG;
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const COLORS = ["#6366f1","#14b8a6","#f59e0b","#ec4899","#8b5cf6"];
    const RESULTS_URL = (window.POLL_CONFIG.RESULTS_URL || "").trim()
      || new URL("results.html", window.location.href).href;

    const appEl = document.getElementById("app");
    const titleEl = document.getElementById("title");
    const toastEl = document.getElementById("toast");
    const peekBtn = document.getElementById("peekBtn");
    const peekOverlay = document.getElementById("peekOverlay");
    const peekCard = document.getElementById("peekCard");
    let peekTimer = null;

    let currentPollId = null;
    let mode = "vote"; // "vote" | "results"
    let lastResults = null;
    let resetTimer = null;

    function pct(count, total) {
      if (!total) return 0;
      return Math.round((count / total) * 100);
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    }

    async function rpc(fn, args) {
      const { data, error } = await sb.rpc(fn, args || {});
      if (error) throw error;
      return data;
    }

    function renderVote(poll) {
      const opts = poll.options.map((o, i) =>
        `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("");
      appEl.innerHTML = `
        <h1 class="question">${esc(poll.question)}</h1>
        <div class="options">${opts}</div>`;
      appEl.querySelectorAll(".opt").forEach(b => {
        b.addEventListener("click", () => vote(parseInt(b.dataset.i, 10)));
      });
      document.body.classList.remove("showing-results");
      appEl.classList.remove("compact");
      peekBtn.style.display = "";
    }

    function resultRows(options, results) {
      const total = (results && results.total) || 0;
      return options.map((o, i) => {
        const c = (results && results.counts && results.counts[i]) || 0;
        const p = pct(c, total);
        return `
          <div class="result-row">
            <div class="result-top"><span>${esc(o)}</span><span class="pct">${p}%</span></div>
            <div class="bar"><div class="fill" style="width:${p}%;background:${COLORS[i % COLORS.length]}"></div></div>
          </div>`;
      }).join("");
    }

    async function showPeek() {
      try {
        const [poll, results] = await Promise.all([
          rpc("get_active_poll"), rpc("get_active_results")
        ]);
        if (!poll) return;
        const total = (results && results.total) || 0;
        peekCard.innerHTML = `
          <h2>${esc(poll.question)}</h2>
          ${resultRows(poll.options, results)}
          <p class="peek-meta">${total} vote${total === 1 ? "" : "s"} so far</p>
          <div class="qr-block" id="peekQr">
            <span class="qr-cap">See all the past results here:</span>
          </div>`;
        peekCard.classList.toggle("compact", poll.options.length > 5);
        renderQR(document.getElementById("peekQr"), true);
        peekOverlay.classList.add("show");
        clearTimeout(peekTimer);
        peekTimer = setTimeout(hidePeek, 5000);
      } catch (e) {}
    }
    function hidePeek() {
      clearTimeout(peekTimer);
      peekOverlay.classList.remove("show");
    }
    peekBtn.addEventListener("click", showPeek);
    peekOverlay.addEventListener("click", hidePeek);

    function renderResults(poll, results) {
      const total = results.total || 0;
      const rows = poll.options.map((o, i) => {
        const c = (results.counts && results.counts[i]) || 0;
        const p = pct(c, total);
        return `
          <div class="result-row">
            <div class="result-top"><span>${esc(o)}</span><span class="pct">${p}%</span></div>
            <div class="bar"><div class="fill" style="width:${p}%;background:${COLORS[i % COLORS.length]}"></div></div>
          </div>`;
      }).join("");
      appEl.innerHTML = `
        <h1 class="question">${esc(poll.question)}</h1>
        <p class="thanks">Thanks for voting!</p>
        ${rows}
        <p class="meta">${total} vote${total === 1 ? "" : "s"} so far</p>
        <button class="nextbtn" id="next">Next person ›</button>`;
      document.body.classList.add("showing-results");
      appEl.classList.toggle("compact", poll.options.length > 5);
      document.getElementById("next").addEventListener("click", backToVote);
      hidePeek();
      peekBtn.style.display = "none";
    }

    function renderQR(block, captionFirst) {
      block = block || document.getElementById("qrBlock");
      if (!block || typeof qrcode === "undefined") return;
      try {
        const qr = qrcode(0, "M");
        qr.addData(RESULTS_URL);
        qr.make();
        const img = document.createElement("img");
        img.src = qr.createDataURL(8);
        img.alt = "QR code to results page";
        if (captionFirst) block.appendChild(img);
        else block.insertBefore(img, block.firstChild);
      } catch (e) {}
    }

    function backToVote() {
      clearTimeout(resetTimer);
      mode = "vote";
      toastEl.textContent = "";
      load(true);
    }

    async function vote(i) {
      try {
        const results = await rpc("cast_vote", {
          p_option_index: i,
          p_location_id: localStorage.getItem("kioskLocationId") || null,
        });
        lastResults = results;
        mode = "results";
        const poll = await rpc("get_active_poll");
        renderResults(poll, results);
        clearTimeout(resetTimer);
        resetTimer = setTimeout(backToVote, 8000); // auto-reset for the next voter
      } catch (e) {
        toastEl.textContent = e.message || "Could not record vote.";
      }
    }

    async function load(force) {
      try {
        const poll = await rpc("get_active_poll");
        if (!poll) {
          appEl.innerHTML = `<div class="empty">No active poll right now.</div>`;
          currentPollId = null;
          return;
        }
        // If the admin changed the poll, always jump back to voting view.
        if (poll.id !== currentPollId) {
          currentPollId = poll.id;
          mode = "vote";
        }
        if (mode === "vote" || force) {
          mode = "vote";
          renderVote(poll);
        }
      } catch (e) {
        appEl.innerHTML = `<div class="empty">Connection problem. Retrying…</div>`;
      }
    }

    async function loadTitle() {
      try {
        const t = await rpc("get_poll_title");
        titleEl.textContent = t || "";
      } catch (e) {}
    }

    function deviceId() {
      let id = localStorage.getItem("kioskDeviceId");
      if (!id) {
        id = (crypto.randomUUID && crypto.randomUUID()) ||
          "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
            const r = Math.random() * 16 | 0;
            return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
          });
        localStorage.setItem("kioskDeviceId", id);
      }
      return id;
    }

    async function ping() {
      try {
        await rpc("device_ping", {
          p_device_id: deviceId(),
          p_location_id: localStorage.getItem("kioskLocationId") || null,
          p_name: localStorage.getItem("kioskDeviceName") || null,
        });
      } catch (e) {}
    }

    load(true);
    loadTitle();
    ping();
    // Poll for changes so the kiosk updates if the admin swaps the question.
    setInterval(() => { if (mode === "vote") load(false); }, 3000);
    setInterval(loadTitle, 10000);
    setInterval(ping, 60000); // heartbeat so admin can see this tablet is online
  </script>
</body>
</html>
